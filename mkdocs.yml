site_name: Hiroshima TCT Wiki
site_description: 広島大学のレーザー TCT スキャン装置（AC-LGAD）の使い方 Wiki
site_url: https://kanato-m.github.io/Hiroshima-TCT-wiki/
repo_url: https://github.com/Kanato-M/Hiroshima-TCT-wiki
repo_name: Kanato-M/Hiroshima-TCT-wiki

validation:
  anchors: warn
edit_uri: edit/main/docs/

theme:
  name: material
  language: ja
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: ja
          name: 日本語
          default: true
          build: true
        - locale: en
          name: English
          build: true
          site_description: How to use the laser TCT scan setup (AC-LGAD) at Hiroshima University
          nav_translations:
            ホーム: Home
            はじめに: Introduction
            TCT とは: What is TCT?
            安全上の注意: Safety
            原理: Principles
            信号形成: Signal formation
            レーザーと照射方式: Lasers and illumination
            スキャンの種類（一般論）: Scan types (general)
            セットアップ: Setup
            システム構成: System overview
            センサーと座標系: Sensor and coordinates
            制御 PC とソフトウェア: Control PC and software
            測定: Measurement
            測定の全体の流れ: Measurement workflow
            GUI の画面構成: GUI layout
            1. 起動と機器の接続: 1. Start-up and connection
            2. 位置合わせ: 2. Alignment
            3. TUNE 最適化: 3. TUNE optimization
            4. 自動スキャン: 4. Automatic scans
            5. データ回収と簡易解析: 5. Data transfer and quick analysis
            解析: Analysis
            波形解析: Waveform analysis
            リファレンス: Reference
            トラブルシューティング: Troubleshooting
            標準設定値一覧: Standard settings
            出力ファイル一覧: Output files
            用語集: Glossary
            参考文献: Bibliography
            Wiki の編集方法: Contributing
            内部情報（パスワード）: Internal information (password)
  # 内部情報ページ（docs/*/internal.md）をパスワードで暗号化する。search より後に置くこと
  # Encrypts the internal page (docs/*/internal.md). Must come after search.
  - encryptcontent:
      title_prefix: '🔒 '
      summary: 'このページは研究室内部向けです / Lab members only'
      placeholder: 'パスワード / Password'
      password_button: true
      password_button_text: '表示 / Show'
      decryption_failure_message: 'パスワードが違います / Wrong password'
      encryption_info_message: 'このページを見るには研究室のパスワードが必要です / A lab password is required to view this page'
      search_index: encrypted
      remember_password: false

nav:
  - ホーム: index.md
  - はじめに:
      - TCT とは: introduction/what-is-tct.md
      - 安全上の注意: introduction/safety.md
  - 原理:
      - 信号形成: principle/signal-formation.md
      - レーザーと照射方式: principle/lasers.md
      - スキャンの種類（一般論）: principle/scan-types.md
  - セットアップ:
      - システム構成: setup/hardware.md
      - センサーと座標系: setup/sensor.md
      - 制御 PC とソフトウェア: setup/software.md
  - 測定:
      - 測定の全体の流れ: measurement/procedure.md
      - GUI の画面構成: measurement/gui-overview.md
      - 1. 起動と機器の接続: measurement/connect.md
      - 2. 位置合わせ: measurement/alignment.md
      - 3. TUNE 最適化: measurement/tune.md
      - 4. 自動スキャン: measurement/scans.md
      - 5. データ回収と簡易解析: measurement/data.md
  - 解析:
      - 波形解析: analysis/waveform.md
  - リファレンス:
      - トラブルシューティング: reference/troubleshooting.md
      - 標準設定値一覧: reference/settings.md
      - 出力ファイル一覧: reference/files.md
      - 用語集: reference/glossary.md
      - 参考文献: reference/bibliography.md
      - Wiki の編集方法: reference/contributing.md
      - 内部情報（パスワード）: internal.md
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Kanato-M/Hiroshima-TCT-wiki
